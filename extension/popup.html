<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .error { color: #c62828; overflow-wrap: anywhere; }
  .muted { color: #666; }
  button { margin-top: 8px; padding: 4px 12px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Claude Sync</h1>
<p id="state"></p>
<p id="error" class="error" hidden></p>
<p id="login" hidden><a href="https://claude.ai/login" target="_blank">Log in to Claude</a>, then sync again.</p>
<p id="last" class="muted"></p>
<button id="sync">Sync now</button>
<script src="popup.js"></script>
</body>
</html>
